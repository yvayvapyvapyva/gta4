<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Renault Symbol — 3D Viewer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312141a'/%3E%3Cpath d='M5 20h22v3a2 2 0 0 1-2 2h-1l-2-3H10l-2 3H7a2 2 0 0 1-2-2z' fill='%23ff8a3d'/%3E%3Cpath d='M7 20l2-6a3 3 0 0 1 2-2h10a3 3 0 0 1 2 2l2 6z' fill='%23e8ebf2'/%3E%3C/svg%3E">
<style>
  :root { --bg:#12141a; --panel:rgba(20,23,31,.82); --line:rgba(255,255,255,.10); --fg:#e8ebf2; --dim:#98a0b3; --acc:#ff8a3d; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg);
    font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  #view { width:100%; height:100%; display:block; touch-action:none; outline:none; }

  #hud { position:fixed; left:14px; top:14px; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:12px 14px; backdrop-filter:blur(10px); min-width:190px; }
  #hud h1 { margin:0 0 8px; font-size:14px; font-weight:600; letter-spacing:.2px;
    color:var(--acc); max-width:min(46vw,420px); overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; }
  #stats { color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; }
  #stats b { color:var(--fg); font-weight:600; }

  #bar { position:fixed; left:14px; right:14px; bottom:14px; display:flex; gap:8px; flex-wrap:wrap; }
  button { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:8px;
    padding:8px 12px; cursor:pointer; font:inherit; backdrop-filter:blur(10px); transition:.15s; }
  button:hover { border-color:var(--acc); color:#fff; }
  button.on { background:var(--acc); color:#1a1206; border-color:var(--acc); font-weight:600; }

  #loader { position:fixed; inset:0; display:grid; place-items:center; background:var(--bg); z-index:10; transition:opacity .5s; }
  #loader.hide { opacity:0; pointer-events:none; }
  #loader .box { text-align:center; width:260px; }
  #loader .t { font-size:14px; margin-bottom:12px; }
  #track { height:3px; background:rgba(255,255,255,.12); border-radius:3px; overflow:hidden; }
  #fill { height:100%; width:0%; background:var(--acc); transition:width .2s; }
  #msg { margin-top:10px; color:var(--dim); font-size:12px; }
  #err { color:#ff6b6b; }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="hud">
  <h1 id="title">—</h1>
  <div id="stats">загрузка…</div>
</div>

<div id="bar">
  <button id="bOpen">Открыть файл…</button>
  <button id="bSpin" class="on">Авто-облёт</button>
  <button id="bWire">Wireframe</button>
  <button id="bGrid">Сетка</button>
  <button id="bReset">Сброс кадра</button>
</div>

<input type="file" id="fileIn" accept=".glb,.gltf,model/gltf-binary,model/gltf+json" hidden>

<div id="loader">
  <div class="box">
    <div class="t">Загрузка модели…</div>
    <div id="track"><div id="fill"></div></div>
    <div id="msg">car.glb</div>
  </div>
</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
<script>
// Модель можно переключить адресом: index.html?model=car_lights.glb
const MODEL = new URLSearchParams(location.search).get("model") || "car.glb";
const ENV_URL = "https://assets.babylonjs.com/environments/environmentSpecular.env";

const canvas = document.getElementById("view");
const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer:true, stencil:true }, true);
const scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color4(0.07, 0.08, 0.10, 1);
scene.useRightHandedSystem = false;

const ip = scene.imageProcessingConfiguration;
ip.toneMappingEnabled = true;
ip.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
ip.exposure = 1.15;
ip.contrast = 1.08;

const cam = new BABYLON.ArcRotateCamera("cam", -Math.PI / 2, Math.PI / 2.6, 9, new BABYLON.Vector3(0, 0.7, 0), scene);
cam.attachControl(canvas, true);
cam.lowerRadiusLimit = 2.2;
cam.upperRadiusLimit = 40;
cam.lowerBetaLimit = 0.12;
cam.upperBetaLimit = Math.PI / 2 + 0.15;
cam.wheelDeltaPercentage = 0.02;
cam.pinchDeltaPercentage = 0.02;
cam.panningSensibility = 400;
cam.useAutoRotationBehavior = true;
cam.autoRotationBehavior.idleRotationSpeed = 0.32;
cam.autoRotationBehavior.idleRotationWaitTime = 1200;
cam.autoRotationBehavior.idleRotationSpinupTime = 2600;

const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
hemi.intensity = 0.45;
hemi.groundColor = new BABYLON.Color3(0.16, 0.17, 0.2);

const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.55, -1, 0.45), scene);
sun.position = new BABYLON.Vector3(7, 11, -6);
sun.intensity = 2.6;

const shadow = new BABYLON.ShadowGenerator(2048, sun);
shadow.useBlurExponentialShadowMap = true;
shadow.blurKernel = 32;
shadow.darkness = 0.42;

// environment for PBR reflections (car paint is metallic)
let envFailed = false;
try {
  scene.environmentTexture = BABYLON.CubeTexture.CreateFromPrefilteredData(ENV_URL, scene);
  scene.environmentIntensity = 0.85;
} catch (e) { envFailed = true; }

const ground = BABYLON.MeshBuilder.CreateGround("ground", { width:60, height:60 }, scene);
const gm = new BABYLON.StandardMaterial("gm", scene);
gm.diffuseColor = new BABYLON.Color3(0.13, 0.14, 0.16);
gm.specularColor = new BABYLON.Color3(0.06, 0.06, 0.07);
ground.material = gm;
ground.receiveShadows = true;

const grid = BABYLON.MeshBuilder.CreateGround("grid", { width:60, height:60, subdivisions:40 }, scene);
const gridMat = new BABYLON.StandardMaterial("gridMat", scene);
gridMat.wireframe = true;
gridMat.emissiveColor = new BABYLON.Color3(0.30, 0.33, 0.38);
gridMat.alpha = 0.16;
gridMat.disableLighting = true;
grid.material = gridMat;
grid.position.y = 0.002;

const stat = document.getElementById("stats");
const fill = document.getElementById("fill");
const msg = document.getElementById("msg");
const loader = document.getElementById("loader");
const title = document.getElementById("title");

let meshes = [], triCount = 0, loaded = false;
let viewTarget = new BABYLON.Vector3(0, 0.7, 0), viewRadius = 9;

function resetView() {
  cam.alpha = -Math.PI / 2;
  cam.beta = Math.PI / 2.6;
  cam.radius = viewRadius;
  cam.setTarget(viewTarget.clone());
}

function human(n) {
  return n >= 1e6 ? (n / 1e6).toFixed(2) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n);
}

function refreshStats() {
  if (!loaded) return;
  stat.innerHTML =
    "треугольников <b>" + human(triCount) + "</b><br>" +
    "мешей <b>" + meshes.length + "</b> · draw calls <b>" + scene.getActiveMeshes().length + "</b><br>" +
    "fps <b>" + engine.getFps().toFixed(0) + "</b>";
}

// Выгружает ранее загруженную модель, чтобы следующая не накладывалась на неё.
// ground/grid и их материалы не трогаем.
function unloadModel() {
  for (const m of meshes) m.dispose(false, true);
  meshes = [];
  triCount = 0;
  loaded = false;
  window.__ready = false;
}

// src — либо URL (car.glb, ?model=...), либо объект File с диска.
function loadModel(src, label) {
  unloadModel();
  const before = new Set(scene.meshes);
  title.textContent = label;
  loader.classList.remove("hide");
  fill.style.width = "0%";
  fill.style.background = "";
  stat.textContent = "загрузка…";

  return BABYLON.SceneLoader.AppendAsync("", src, scene,
    (ev) => {
      if (ev.lengthComputable) fill.style.width = ((ev.loaded / ev.total) * 100).toFixed(1) + "%";
      else fill.style.width = "100%";
      msg.textContent = human(ev.loaded / 1048576) + " / " + human(ev.total / 1048576) + " MB";
    }
  ).then(() => {
    meshes = scene.meshes.filter(m => !before.has(m) && m.getTotalVertices() > 0);
    if (!meshes.length) throw new Error("в модели нет геометрии");
    triCount = meshes.reduce((n, m) => n + m.getTotalIndices() / 3, 0);

    // The glTF loader keeps every node transform on its own TransformNode and hangs the
    // primitive meshes underneath it. Re-parenting those meshes to a new root would throw
    // the node transform away (that is where the four wheels are positioned), so the scene
    // graph is left untouched and the ground plane is moved to the model instead.
    let mn = new BABYLON.Vector3(1e9, 1e9, 1e9), mx = new BABYLON.Vector3(-1e9, -1e9, -1e9);
    const tmp = new BABYLON.Vector3();
    for (const m of meshes) {
      m.computeWorldMatrix(true);
      const wm = m.getWorldMatrix();
      const bb = m.getBoundingInfo().boundingBox;
      for (let i = 0; i < 8; i++) {
        BABYLON.Vector3.TransformCoordinatesToRef(bb.vectors[i], wm, tmp);
        mn = BABYLON.Vector3.Minimize(mn, tmp);
        mx = BABYLON.Vector3.Maximize(mx, tmp);
      }
      m.receiveShadows = true;
      shadow.addShadowCaster(m);
    }

    const center = BABYLON.Vector3.Center(mn, mx);
    const size = mx.subtract(mn);
    ground.position.y = mn.y;
    grid.position.y = mn.y + 0.002;

    viewTarget = new BABYLON.Vector3(center.x, mn.y + size.y * 0.45, center.z);
    viewRadius = Math.max(size.x, size.z) * 2.0;
    cam.lowerRadiusLimit = Math.max(1.2, Math.max(size.x, size.z) * 0.45);
    cam.upperRadiusLimit = Math.max(size.x, size.z) * 8;
    resetView();

    // clear interior parts that are invisible anyway
    scene.skipPointerMovePicking = true;
    loaded = true;
    fill.style.width = "100%";
    msg.textContent = "готово";
    setTimeout(() => loader.classList.add("hide"), 250);
    refreshStats();

    // Флаг для автоматических проверок: сцена готова и первый кадр отрисован.
    scene.executeWhenReady(() => {
      scene.onAfterRenderObservable.addOnce(() => { window.__ready = true; });
    });
  }).catch((e) => {
    console.error(e);
    msg.innerHTML = '<span id="err">ошибка загрузки: ' + (e && e.message ? e.message : e) + "</span>";
    fill.style.background = "#ff6b6b";
  });
}

function loadFile(file) {
  if (!file) return;
  // Отдаём сам File, а не blob-URL: у blob-URL нет расширения, и Babylon
  // выбирает загрузчик по расширению имени — не находит glTF-плагин и падает
  // на .babylon по умолчанию. У File есть .name, поэтому всё работает.
  loadModel(file, file.name);
}

loadModel(MODEL, MODEL);

const bSpin = document.getElementById("bSpin");
bSpin.onclick = () => { cam.useAutoRotationBehavior = !cam.useAutoRotationBehavior; bSpin.classList.toggle("on", cam.useAutoRotationBehavior); };

let wire = false;
const bWire = document.getElementById("bWire");
bWire.onclick = () => {
  wire = !wire;
  for (const m of meshes) {
    const mat = m.material;
    if (!mat) continue;
    if (!mat._orig) mat._orig = mat.wireframe;
    mat.wireframe = wire ? true : mat._orig;
  }
  bWire.classList.toggle("on", wire);
};

const bGrid = document.getElementById("bGrid");
bGrid.classList.add("on");
bGrid.onclick = () => { grid.setEnabled(!grid.isEnabled()); bGrid.classList.toggle("on", grid.isEnabled()); };

document.getElementById("bReset").onclick = () => { if (loaded) resetView(); };

// --- выбор файла с диска -------------------------------------------------
const fileIn = document.getElementById("fileIn");
document.getElementById("bOpen").onclick = () => fileIn.click();
fileIn.onchange = () => { loadFile(fileIn.files[0]); fileIn.value = ""; };

// Тот же файл можно перетащить в окно.
for (const ev of ["dragover", "drop"]) {
  window.addEventListener(ev, (e) => e.preventDefault());
}
window.addEventListener("drop", (e) => {
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) loadFile(f);
});

setInterval(refreshStats, 400);
window.addEventListener("resize", () => engine.resize());
engine.runRenderLoop(() => scene.render());
</script>
</body>
</html>
