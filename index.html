<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Renault Symbol — Drive</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312141a'/%3E%3Cpath d='M5 20h22v3a2 2 0 0 1-2 2h-1l-2-3H10l-2 3H7a2 2 0 0 1-2-2z' fill='%23ff8a3d'/%3E%3Cpath d='M7 20l2-6a3 3 0 0 1 2-2h10a3 3 0 0 1 2 2l2 6z' fill='%23e8ebf2'/%3E%3C/svg%3E">
<style>
  :root { --bg:#12141a; --fg:#e8ebf2; --dim:#98a0b3; --acc:#ff8a3d; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg);
    font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  #view { width:100%; height:100%; display:block; touch-action:none; outline:none; }

  #loader { position:fixed; inset:0; display:grid; place-items:center; background:var(--bg); z-index:10; transition:opacity .5s; }
  #loader.hide { opacity:0; pointer-events:none; }
  #loader .box { text-align:center; width:260px; }
  #loader .t { font-size:14px; margin-bottom:12px; }
  #track { height:3px; background:rgba(255,255,255,.12); border-radius:3px; overflow:hidden; }
  #fill { height:100%; width:0%; background:var(--acc); transition:width .2s; }
  #msg { margin-top:10px; color:var(--dim); font-size:12px; }
  #err { color:#ff6b6b; }

  #hud { position:fixed; left:14px; bottom:14px; z-index:5; pointer-events:none;
    display:flex; align-items:flex-end; gap:14px; }
  #spd { font-size:44px; font-weight:600; line-height:1; letter-spacing:-2px;
    font-variant-numeric:tabular-nums; text-shadow:0 2px 10px rgba(0,0,0,.6); }
  #spd small { font-size:14px; font-weight:400; color:var(--dim); margin-left:5px; letter-spacing:0; }
  #gear { min-width:34px; height:44px; display:grid; place-items:center; font-size:22px; font-weight:600;
    color:var(--acc); background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);
    border-radius:8px; }
  #keys { position:fixed; right:14px; bottom:14px; z-index:5; pointer-events:none;
    color:var(--dim); font-size:11.5px; text-align:right; text-shadow:0 1px 6px rgba(0,0,0,.7); }
  #keys b { color:var(--fg); font-weight:600; }
  #cam { position:fixed; left:14px; top:14px; z-index:5; pointer-events:none;
    font-size:11.5px; color:var(--dim); text-shadow:0 1px 6px rgba(0,0,0,.7); }

  #pad { position:fixed; inset:auto 0 0 0; z-index:6; display:none; padding:0 14px 18px;
    justify-content:space-between; pointer-events:none; }
  #pad .col { display:flex; gap:12px; }
  #pad button { pointer-events:auto; width:66px; height:66px; border-radius:50%; font-size:22px;
    color:var(--fg); background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(6px); -webkit-user-select:none; user-select:none; touch-action:none; }
  #pad button.on { background:rgba(255,138,61,.35); border-color:var(--acc); }
  @media (pointer:coarse) { #pad { display:flex; } #keys { display:none; } }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="cam">камера: <b id="camname">следом</b> — C переключить</div>

<div id="hud">
  <div id="gear">N</div>
  <div id="spd">0<small>км/ч</small></div>
</div>
<div id="keys">
  <b>W/↑</b> газ · <b>S/↓</b> тормоз/назад · <b>A/D</b> поворот<br>
  <b>Space</b> ручник · <b>C</b> камера · <b>R</b> сброс
</div>

<div id="pad">
  <div class="col">
    <button data-k="ArrowLeft">◀</button>
    <button data-k="ArrowRight">▶</button>
  </div>
  <div class="col">
    <button data-k="ArrowDown">▼</button>
    <button data-k="ArrowUp">▲</button>
  </div>
</div>

<div id="loader">
  <div class="box">
    <div class="t">Загрузка модели…</div>
    <div id="track"><div id="fill"></div></div>
    <div id="msg">auto/car.glb</div>
  </div>
</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
<script>
// Модель можно переключить адресом: index.html?model=auto/car.glb
// По умолчанию — auto/car.glb.
const MODEL = new URLSearchParams(location.search).get("model") || "auto/car.glb";
const ENV_URL = "https://assets.babylonjs.com/environments/environmentSpecular.env";

const canvas = document.getElementById("view");
const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer:true, stencil:true }, true);
const scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color4(0.07, 0.08, 0.10, 1);
scene.useRightHandedSystem = false;

const ip = scene.imageProcessingConfiguration;
ip.toneMappingEnabled = true;
ip.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
ip.exposure = 1.15;
ip.contrast = 1.08;

const cam = new BABYLON.ArcRotateCamera("cam", -Math.PI / 2, Math.PI / 2.6, 9, new BABYLON.Vector3(0, 0.7, 0), scene);
cam.attachControl(canvas, true);
cam.lowerRadiusLimit = 2.2;
cam.upperRadiusLimit = 40;
cam.lowerBetaLimit = 0.12;
cam.upperBetaLimit = Math.PI / 2 + 0.15;
cam.wheelDeltaPercentage = 0.02;
cam.pinchDeltaPercentage = 0.02;
cam.panningSensibility = 0;

const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
hemi.intensity = 0.45;
hemi.groundColor = new BABYLON.Color3(0.16, 0.17, 0.2);

const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.55, -1, 0.45), scene);
sun.position = new BABYLON.Vector3(7, 11, -6);
sun.intensity = 2.6;

const shadow = new BABYLON.ShadowGenerator(2048, sun);
shadow.useBlurExponentialShadowMap = true;
shadow.blurKernel = 32;
shadow.darkness = 0.42;

// мягкий свет внутри салона — включается только в режиме «салон» (см. applyCamMode)
const cabin = new BABYLON.PointLight("cabin", new BABYLON.Vector3(0, 0, 0), scene);
cabin.diffuse = new BABYLON.Color3(1, 0.96, 0.9);
cabin.range = 5;
cabin.intensity = 0;

// environment for PBR reflections (car paint is metallic)
try {
  scene.environmentTexture = BABYLON.CubeTexture.CreateFromPrefilteredData(ENV_URL, scene);
  scene.environmentIntensity = 0.85;
} catch (e) {}

const GROUND_SIZE = 320;
const TILE = 8;

const ground = BABYLON.MeshBuilder.CreateGround("ground", { width:GROUND_SIZE, height:GROUND_SIZE, subdivisions:1 }, scene);
const gm = new BABYLON.StandardMaterial("gm", scene);
gm.specularColor = new BABYLON.Color3(0.06, 0.06, 0.07);
ground.material = gm;
ground.receiveShadows = true;

// сетка на земле — без неё движение не читается
const gridTex = new BABYLON.DynamicTexture("grid", { width:512, height:512 }, scene, true);
gridTex.hasAlpha = false;
{
  const g = gridTex.getContext();
  g.fillStyle = "#1b1d23";
  g.fillRect(0, 0, 512, 512);
  g.strokeStyle = "#2b303a";
  g.lineWidth = 3;
  g.strokeRect(0, 0, 512, 512);
  g.strokeStyle = "#23272f";
  g.lineWidth = 1.5;
  for (let i = 1; i < 4; i++) {
    g.beginPath(); g.moveTo(i * 128, 0); g.lineTo(i * 128, 512); g.stroke();
    g.beginPath(); g.moveTo(0, i * 128); g.lineTo(512, i * 128); g.stroke();
  }
  gridTex.update();
  gridTex.uScale = gridTex.vScale = GROUND_SIZE / TILE;
}
gm.diffuseTexture = gridTex;
gm.diffuseColor = new BABYLON.Color3(0.55, 0.55, 0.6);

const fill = document.getElementById("fill");
const msg = document.getElementById("msg");
const loader = document.getElementById("loader");
const spdEl = document.getElementById("spd");
const gearEl = document.getElementById("gear");
const camNameEl = document.getElementById("camname");

let meshes = [];
let ready = false;

function human(n) {
  return n >= 1e6 ? (n / 1e6).toFixed(2) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n);
}

// ===================== вождение =====================
// Модель: вперёд −Z, вверх +Y, +X — левая сторона, ось колёс X.
const CAR = {
  root: null,
  wheels: [],
  v: 0,            // м/с, + = вперёд
  yaw: 0,          // рад, + = налево
  steer: 0,        // текущий угол поворота колёс, + = налево
  lift: 0,         // высота подъёма кузова над землёй
  maxSpeed: 40,    // ≈144 км/ч
  maxReverse: 11,
  accel: 9.5,
  reverseAccel: 6,
  brake: 18,
  drag: 0.0055,
  roll: 0.35,
  grip: 11,
  wheelbase: 2.75,
  wheelR: 0.32,
  camYaw: 0, camPitch: 1.13, camDist: 7.4,
  mode: 0,           // 0 следом · 1 салон · 2 свободная
  eye: null,         // точка обзора в локальной системе кузова (заполняется по модели)
  lookYaw: 0, lookPitch: 0,  // смещение взгляда в салоне мышью
  idle: performance.now(),
};

const CAM_MODES = ["следом", "салон", "свободная"];
const COCKPIT_PITCH = 0.16;   // базовый наклон взгляда вниз, рад

const keys = Object.create(null);

const CONTROL_KEYS = new Set(["KeyW","KeyA","KeyS","KeyD","ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space","KeyC","KeyR"]);
addEventListener("keydown", (e) => {
  if (CONTROL_KEYS.has(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.code === "KeyC") toggleCam();
  if (e.code === "KeyR") resetCar();
});
addEventListener("keyup", (e) => { keys[e.code] = false; });
addEventListener("blur", () => { for (const k in keys) keys[k] = false; });

// тач-кнопки
for (const b of document.querySelectorAll("#pad button")) {
  const code = b.dataset.k;
  const on = (e) => { e.preventDefault(); keys[code] = true; b.classList.add("on"); };
  const off = (e) => { e.preventDefault(); keys[code] = false; b.classList.remove("on"); };
  b.addEventListener("pointerdown", on);
  b.addEventListener("pointerup", off);
  b.addEventListener("pointercancel", off);
  b.addEventListener("pointerleave", off);
}

// Режимы камеры: следом → салон → свободная. attachedToElement надёжнее detachControl:
// он гасит и inputs камеры.
// Модель внешняя: внутренних поверхностей у неё нет, и из салона виден только
// односторонний кузов — с выключенным отсечением задних граней он читается как интерьер.
let twoSidedSaved = null;
function setTwoSided(on) {
  if (on && !twoSidedSaved) {
    twoSidedSaved = new Map();
    for (const m of meshes) {
      for (const mt of (Array.isArray(m.material) ? m.material : [m.material])) {
        if (!mt || twoSidedSaved.has(mt)) continue;
        twoSidedSaved.set(mt, [mt.backFaceCulling, mt.twoSidedLighting]);
        mt.backFaceCulling = false;
        mt.twoSidedLighting = true;
      }
    }
  } else if (!on && twoSidedSaved) {
    for (const [mt, v] of twoSidedSaved) { mt.backFaceCulling = v[0]; mt.twoSidedLighting = v[1]; }
    twoSidedSaved = null;
  }
}

function applyCamMode() {
  const m = CAR.mode;
  camNameEl.textContent = CAM_MODES[m];
  // салон — отдельная камера, привязанная к кузову; орбитальная нужна в двух
  // остальных режимах и мышь получает только в свободном
  scene.activeCamera = m === 1 ? cockpit : cam;
  if (m === 2) { cam.attachControl(canvas, true); cam.inputs.attachedToElement = true; }
  else { cam.detachControl(true); cam.inputs.attachedToElement = false; }
  // салон освещён только изнутри: снаружи свет не нужен и портил бы вид
  cabin.intensity = m === 1 ? 0.85 : 0;
  setTwoSided(m === 1);
  CAR.idle = -1e9;
}

function toggleCam() {
  CAR.mode = (CAR.mode + 1) % CAM_MODES.length;
  applyCamMode();
}

function resetCar() {
  if (!CAR.root) return;
  CAR.v = 0; CAR.yaw = 0; CAR.steer = 0;
  CAR.lookYaw = 0; CAR.lookPitch = 0;
  CAR.root.position.set(0, CAR.lift, 0);
  CAR.root.rotation.y = 0;
  for (const w of CAR.wheels) { w.angle = 0; w.spin.rotation.x = 0; w.steer.rotation.y = 0; }
}

// ручной облёт камеры мышью (в режимах «следом» и «салон»)
let drag = false, lastX = 0, lastY = 0;
canvas.addEventListener("pointerdown", (e) => {
  if (CAR.mode === 2) return;
  drag = true; lastX = e.clientX; lastY = e.clientY; CAR.idle = performance.now();
});
addEventListener("pointermove", (e) => {
  if (!drag) return;
  if (CAR.mode === 1) {
    // в салоне тянем обзор: вправо — смотрим вправо, вниз — вниз
    CAR.lookYaw = clamp(CAR.lookYaw - (e.clientX - lastX) * 0.005, -1.3, 1.3);
    CAR.lookPitch = clamp(CAR.lookPitch + (e.clientY - lastY) * 0.004, -0.45, 0.55);
  } else {
    CAR.camYaw -= (e.clientX - lastX) * 0.006;
    CAR.camPitch = clamp(CAR.camPitch + (e.clientY - lastY) * 0.005, 0.32, 1.45);
  }
  lastX = e.clientX; lastY = e.clientY;
  CAR.idle = performance.now();
});
addEventListener("pointerup", () => { if (drag) CAR.idle = performance.now(); drag = false; });
canvas.addEventListener("wheel", (e) => {
  if (CAR.mode !== 0) return;
  e.preventDefault();
  CAR.camDist = clamp(CAR.camDist * (1 + Math.sign(e.deltaY) * 0.08), 3.2, 26);
}, { passive:false });

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

function wrapAngle(a) {
  while (a > Math.PI) a -= Math.PI * 2;
  while (a < -Math.PI) a += Math.PI * 2;
  return a;
}

const camTarget = new BABYLON.Vector3(0, 0, 0);
let cockpit = null;   // камера салона, едет вместе с кузовом

function drive(dt) {
  const gas = keys.KeyW || keys.ArrowUp ? 1 : 0;
  const back = keys.KeyS || keys.ArrowDown ? 1 : 0;
  const left = keys.KeyA || keys.ArrowLeft ? 1 : 0;
  const right = keys.KeyD || keys.ArrowRight ? 1 : 0;
  const hand = keys.Space ? 1 : 0;

  const throttle = gas - back;
  const steerIn = left - right;

  // руль: на высокой скорости вращение ограничено, иначе машину крутит как игрушку
  const sp = Math.min(Math.abs(CAR.v) / CAR.maxSpeed, 1);
  const maxSteer = 0.58 - 0.44 * sp;
  const want = steerIn * maxSteer;
  const rate = (want === 0 ? 6 : 3.4) * dt;
  CAR.steer += clamp(want - CAR.steer, -rate, rate);

  // продольная динамика
  let a = 0;
  if (throttle > 0) {
    a = CAR.accel * throttle * clamp(1 - CAR.v / CAR.maxSpeed, 0.12, 1);
  } else if (throttle < 0) {
    if (CAR.v > 0.4) a = -CAR.brake * back;            // тормоз
    else a = -CAR.reverseAccel * back * clamp(1 + CAR.v / CAR.maxReverse, 0.1, 1);
  }
  if (hand) a -= Math.sign(CAR.v) * CAR.brake * hand * (Math.abs(CAR.v) > 0.05 ? 1 : 0);
  a -= Math.sign(CAR.v) * CAR.roll;
  a -= CAR.drag * CAR.v * Math.abs(CAR.v);

  CAR.v = clamp(CAR.v + a * dt, -CAR.maxReverse, CAR.maxSpeed);
  if (Math.abs(CAR.v) < 0.05 && !throttle) CAR.v = 0;

  // траектория: модель велосипеда, ограниченная сцеплением (иначе на скорости
  // машину закручивает сильнее, чем шины держат — получается занос)
  let yawRate = (CAR.v / CAR.wheelbase) * Math.tan(CAR.steer);
  const cap = (hand ? CAR.grip * 0.5 : CAR.grip) / Math.max(Math.abs(CAR.v), 2);
  yawRate = clamp(yawRate, -cap, cap);
  CAR.yaw += yawRate * dt;

  // трансформ кузова
  CAR.root.rotation.y = -CAR.yaw;
  const fwd = new BABYLON.Vector3(Math.sin(CAR.yaw), 0, -Math.cos(CAR.yaw));
  CAR.root.position.addInPlace(fwd.scale(CAR.v * dt));

  // колёса
  for (const w of CAR.wheels) {
    w.angle -= CAR.v / CAR.wheelR * dt;
    w.spin.rotation.x = w.angle;
    // руль поворота — в локальной системе модели, где +X это правая сторона,
    // поэтому поворот налево (CAR.steer > 0) это +rotation.y
    if (w.front) w.steer.rotation.y = CAR.steer;
  }

  // земля едет за машиной, сетка остаётся в мировых координатах
  const p = CAR.root.position;
  ground.position.x = p.x;
  ground.position.z = p.z;
  gridTex.uOffset = p.x / TILE;
  gridTex.vOffset = p.z / TILE;

  // спидометр
  const kmh = Math.abs(CAR.v) * 3.6;
  spdEl.firstChild.nodeValue = String(Math.round(kmh));
  const a2 = Math.abs(CAR.v);
  gearEl.textContent = CAR.v < -0.3 ? "R" : a2 < 0.3 ? "N" : String(clamp(Math.floor(a2 / 9) + 1, 1, 5));

  // камера. target пишем напрямую: setTarget() пересчитывает alpha/beta/radius
  // по текущей позиции и каждый кадр уводил бы камеру в сторону.
  if (CAR.mode === 0) {
    BABYLON.Vector3.LerpToRef(camTarget, new BABYLON.Vector3(p.x, p.y + 0.75, p.z), 1 - Math.exp(-dt * 9), camTarget);
    cam.target.copyFrom(camTarget);
    // возврат камеры за спину по реальному времени, а не по числу кадров
    if (!drag && performance.now() - CAR.idle > 1600) CAR.camYaw *= Math.max(0, 1 - dt * 1.2);
    const k = 1 - Math.exp(-dt * 5);
    cam.alpha = wrapAngle(cam.alpha + wrapAngle((CAR.yaw + Math.PI / 2 + CAR.camYaw) - cam.alpha) * k);
    cam.beta += (CAR.camPitch - cam.beta) * (1 - Math.exp(-dt * 7));
    cam.radius += (CAR.camDist - cam.radius) * (1 - Math.exp(-dt * 7));
  } else if (CAR.mode === 1) {
    // салон: камера уже сидит в кузове, остаётся только повернуть взгляд
    if (!drag && performance.now() - CAR.idle > 1600) {
      const back = Math.max(0, 1 - dt * 1.6);
      CAR.lookYaw *= back; CAR.lookPitch *= back;
    }
    // локальные оси кузова: -Z вперёд, поэтому разворот на π, а лево — это -Yaw
    cockpit.rotation.set(COCKPIT_PITCH + CAR.lookPitch, Math.PI - CAR.lookYaw, 0);
  }
}

loader.classList.remove("hide");
fill.style.width = "0%";
fill.style.background = "";

BABYLON.SceneLoader.AppendAsync("", MODEL, scene,
  (ev) => {
    if (ev.lengthComputable) fill.style.width = ((ev.loaded / ev.total) * 100).toFixed(1) + "%";
    else fill.style.width = "100%";
    msg.textContent = human(ev.loaded / 1048576) + " / " + human(ev.total / 1048576) + " MB";
  }
).then(() => {
  meshes = scene.meshes.filter(m => m.getTotalVertices() > 0 && m !== ground);
  if (!meshes.length) throw new Error("в модели нет геометрии");

  let mn = new BABYLON.Vector3(1e9, 1e9, 1e9), mx = new BABYLON.Vector3(-1e9, -1e9, -1e9);
  const tmp = new BABYLON.Vector3();
  for (const m of meshes) {
    m.computeWorldMatrix(true);
    const wm = m.getWorldMatrix();
    const bb = m.getBoundingInfo().boundingBox;
    for (let i = 0; i < 8; i++) {
      BABYLON.Vector3.TransformCoordinatesToRef(bb.vectors[i], wm, tmp);
      mn = BABYLON.Vector3.Minimize(mn, tmp);
      mx = BABYLON.Vector3.Maximize(mx, tmp);
    }
    m.receiveShadows = true;
    shadow.addShadowCaster(m);
  }

  const center = BABYLON.Vector3.Center(mn, mx);
  const size = mx.subtract(mn);

  // --- корневой узел машины.
  // Лоадер строит сцену с зеркальным корнем __root__ (scale 1,1,-1) — это перевод
  // правостороннего glTF в левосторонний Babylon. Пересчитывать матрицы при переезде
  // нельзя: decompose зеркало теряет и колёса выворачивает диском внутрь. Поэтому
  // цепляем car к родному корню, не трогая его локальный трансформ.
  const root = new BABYLON.TransformNode("car", scene);
  CAR.root = root;
  const tops = new Set();
  for (const m of meshes) { let c = m; while (c.parent) c = c.parent; tops.add(c); }
  for (const n of tops) n.parent = root;

  // --- колёса. У каждого колеса в сцене есть свой узел (TransformNode wheel_lf и т.п.)
  // с началом в центре колеса — он и есть ось вращения. Ставим под него руль и качение,
  // меши (лоадер режет их на примитивы) оставляем с их локальным трансформом.
  const groups = new Map();
  for (const m of meshes) {
    const n = m.parent;
    // /^wheel/ — а не /wheel/: иначе под колесо попадает узел steeringwheel
    if (!n || n === ground || !/^wheel/i.test(n.name)) continue;
    if (!groups.has(n)) groups.set(n, []);
    groups.get(n).push(m);
  }
  if (!groups.size) {
    const tmp2 = new BABYLON.Vector3();
    for (const m of meshes) {
      const bb = m.getBoundingInfo().boundingBox;
      const s = [bb.extendSize.x, bb.extendSize.y, bb.extendSize.z].sort((a, b) => a - b);
      if (!(s[0] < 0.14 && s[1] > 0.2 && Math.abs(s[1] - s[2]) < 0.1)) continue;
      BABYLON.Vector3.TransformCoordinatesToRef(bb.center, m.getWorldMatrix(), tmp2);
      if (Math.abs(tmp2.x) < 0.4 || Math.abs(tmp2.z) < 0.9) continue;
      if (!m._wn) { m._wn = new BABYLON.TransformNode("wheel_" + m.name, scene); m._wn.parent = root; }
      m._wn.position.copyFrom(tmp2);
      m.parent = m._wn;
      if (!groups.has(m._wn)) groups.set(m._wn, []);
      groups.get(m._wn).push(m);
    }
  }

  let minWheelY = 1e9, rSum = 0;
  const zs = [];
  for (const [node, g] of groups) {
    const wp = node.getAbsolutePosition();
    let r = 0;
    for (const m of g) {
      const bb = m.getBoundingInfo().boundingBox;
      r = Math.max(r, bb.extendSize.y, bb.extendSize.z);
    }
    // узел считается колесом, если его геометрия — диск: два равных размера и третий малый
    if (r < 0.2) { groups.delete(node); continue; }
    zs.push(wp.z);
    rSum += r;

    for (const m of g) {
      const bb = m.getBoundingInfo().boundingBox;
      for (let i = 0; i < 8; i++) {
        BABYLON.Vector3.TransformCoordinatesToRef(bb.vectors[i], m.getWorldMatrix(), tmp);
        minWheelY = Math.min(minWheelY, tmp.y);
      }
    }

    const steer = new BABYLON.TransformNode("steer_" + node.name, scene);
    steer.parent = node;
    const spin = new BABYLON.TransformNode("spin_" + node.name, scene);
    spin.parent = steer;
    for (const m of g) m.parent = spin;

    CAR.wheels.push({ steer, spin, node, front: wp.z < 0, angle: 0 });
  }

  const zMin = Math.min(...zs), zMax = Math.max(...zs);
  if (groups.size > 1 && zMax - zMin > 0.5) CAR.wheelbase = zMax - zMin;
  if (rSum > 0) CAR.wheelR = rSum / groups.size;
  for (const w of CAR.wheels) w.front = w.node.getAbsolutePosition().z < (zMin + zMax) / 2;

  // кузов поднимаем так, чтобы колёса встали на землю
  CAR.lift = minWheelY < 1e9 ? -minWheelY : -mn.y;
  root.position.set(0, CAR.lift, 0);

  // --- точка обзора для вида из салона. Ориентиры берём из самой модели:
  // руль задаёт поперечную координату водителя, верх крыши — высоту глаз.
  {
    const box = (list) => {
      const b = { x:[1e9,-1e9], y:[1e9,-1e9], z:[1e9,-1e9] };
      for (const m of list) {
        m.computeWorldMatrix(true);
        const wm = m.getWorldMatrix(), bb = m.getBoundingInfo().boundingBox;
        for (let i = 0; i < 8; i++) {
          BABYLON.Vector3.TransformCoordinatesToRef(bb.vectors[i], wm, tmp);
          b.x[0] = Math.min(b.x[0], tmp.x); b.x[1] = Math.max(b.x[1], tmp.x);
          b.y[0] = Math.min(b.y[0], tmp.y); b.y[1] = Math.max(b.y[1], tmp.y);
          b.z[0] = Math.min(b.z[0], tmp.z); b.z[1] = Math.max(b.z[1], tmp.z);
        }
      }
      return b;
    };
    const isWheel = (m) => CAR.wheels.some(w => w.spin.getChildren(n => true).includes(m));
    const body = box(meshes.filter(m => !isWheel(m)));
    const sw = box(meshes.filter(m => /steering/i.test(m.name)));
    const glass = box(meshes.filter(m => /windscreen|window/i.test(m.name)));
    const hasSw = isFinite(sw.x[0]);
    // по рулю: поперечная координата водителя и глубина, по остеклению — высота.
    // ориентир сверху — верх руля, а не крыша: глаза водителя много ниже крыши
    const ex = hasSw ? (sw.x[0] + sw.x[1]) / 2 : body.x[0] + (body.x[1] - body.x[0]) * 0.3;
    let ey = hasSw ? sw.y[1] + 0.19 : body.y[1] - 0.5;
    if (isFinite(glass.y[0])) ey = Math.min(ey, glass.y[1] - 0.1);
    const ez = hasSw ? (sw.z[0] + sw.z[1]) / 2 + 0.5 : body.z[0] + (body.z[1] - body.z[0]) * 0.55;
    // мировые координаты при старте = локальные + подъём, его и вычитаем
    CAR.eye = new BABYLON.Vector3(ex, ey - CAR.lift, ez);
    // свет салона едет вместе с машиной
    cabin.parent = root;
    cabin.position.copyFrom(CAR.eye);

    // камера салона: обычная UniversalCamera, привязанная к кузову, поэтому едет
    // с машиной сама, а поворот задаётся локально (rotation.y = PI — это вперёд)
    cockpit = new BABYLON.UniversalCamera("cockpit", BABYLON.Vector3.Zero(), scene);
    cockpit.parent = root;
    cockpit.position.copyFrom(CAR.eye);
    cockpit.rotation.set(COCKPIT_PITCH, Math.PI, 0);
    cockpit.fov = 1.1;      // из салона нужно шире, чем снаружи
    cockpit.minZ = 0.04;     // руль и панель приборов в упор
    cockpit.inputs.clear();  // обзором рулит общий обработчик мыши
  }

  cam.lowerRadiusLimit = 3.2;
  cam.upperRadiusLimit = 26;
  cam.alpha = CAR.yaw + Math.PI / 2;
  cam.beta = CAR.camPitch;
  cam.radius = CAR.camDist;
  camTarget.set(0, CAR.lift + 0.75, 0);
  cam.target.copyFrom(camTarget);
  applyCamMode();

  ready = true;
  scene.skipPointerMovePicking = true;
  fill.style.width = "100%";
  msg.textContent = "готово";
  setTimeout(() => loader.classList.add("hide"), 250);
}).catch((e) => {
  console.error(e);
  msg.innerHTML = '<span id="err">ошибка загрузки: ' + (e && e.message ? e.message : e) + "</span>";
  fill.style.background = "#ff6b6b";
});

window.addEventListener("resize", () => engine.resize());

let last = performance.now();
engine.runRenderLoop(() => {
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (ready) drive(dt);
  scene.render();
});
</script>
</body>
</html>
