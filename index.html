<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Renault Symbol — Drive</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312141a'/%3E%3Cpath d='M5 20h22v3a2 2 0 0 1-2 2h-1l-2-3H10l-2 3H7a2 2 0 0 1-2-2z' fill='%23ff8a3d'/%3E%3Cpath d='M7 20l2-6a3 3 0 0 1 2-2h10a3 3 0 0 1 2 2l2 6z' fill='%23e8ebf2'/%3E%3C/svg%3E">
<style>
  :root { --bg:#12141a; --fg:#e8ebf2; --dim:#98a0b3; --acc:#ff8a3d; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg);
    font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  #view { width:100%; height:100%; display:block; touch-action:none; outline:none; }

  #loader { position:fixed; inset:0; display:grid; place-items:center; background:var(--bg); z-index:10; transition:opacity .5s; }
  #loader.hide { opacity:0; pointer-events:none; }
  #loader .box { text-align:center; width:260px; }
  #loader .t { font-size:14px; margin-bottom:12px; }
  #track { height:3px; background:rgba(255,255,255,.12); border-radius:3px; overflow:hidden; }
  #fill { height:100%; width:0%; background:var(--acc); transition:width .2s; }
  #msg { margin-top:10px; color:var(--dim); font-size:12px; }
  #err { color:#ff6b6b; }

  #hud { position:fixed; left:14px; bottom:14px; z-index:5; pointer-events:none;
    display:flex; align-items:flex-end; gap:14px; }
  #spd { font-size:44px; font-weight:600; line-height:1; letter-spacing:-2px;
    font-variant-numeric:tabular-nums; text-shadow:0 2px 10px rgba(0,0,0,.6); }
  #spd small { font-size:14px; font-weight:400; color:var(--dim); margin-left:5px; letter-spacing:0; }
  #gear { min-width:34px; height:44px; display:grid; place-items:center; font-size:22px; font-weight:600;
    color:var(--acc); background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);
    border-radius:8px; }
  #keys { position:fixed; right:14px; bottom:14px; z-index:5; pointer-events:none;
    color:var(--dim); font-size:11.5px; text-align:right; text-shadow:0 1px 6px rgba(0,0,0,.7); }
  #keys b { color:var(--fg); font-weight:600; }
  #cam { position:fixed; left:14px; top:14px; z-index:5; pointer-events:none;
    font-size:11.5px; color:var(--dim); text-shadow:0 1px 6px rgba(0,0,0,.7); }

  #pad { position:fixed; inset:auto 0 0 0; z-index:6; display:none; padding:0 14px 18px;
    justify-content:space-between; pointer-events:none; }
  #pad .col { display:flex; gap:12px; }
  #pad button { pointer-events:auto; width:66px; height:66px; border-radius:50%; font-size:22px;
    color:var(--fg); background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(6px); -webkit-user-select:none; user-select:none; touch-action:none; }
  #pad button.on { background:rgba(255,138,61,.35); border-color:var(--acc); }
  @media (pointer:coarse) { #pad { display:flex; } #keys { display:none; } }

  /* ── редактор площадки ─────────────────────────────────────────── */
  #mapBtn { position:fixed; right:14px; top:14px; z-index:7; padding:8px 14px; border-radius:9px;
    font:inherit; font-size:12.5px; color:var(--fg); background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.16); backdrop-filter:blur(6px); cursor:pointer; }
  #mapBtn:hover { background:rgba(255,255,255,.14); }
  #mapBtn.on { background:rgba(255,138,61,.32); border-color:var(--acc); }

  #mapEdit { position:fixed; inset:0; z-index:8; display:none; pointer-events:none; }
  body.edit-mode #mapEdit { display:block; }
  #mapEdit .bar { position:absolute; top:12px; left:12px; right:12px; display:flex; flex-wrap:wrap;
    gap:8px; align-items:center; pointer-events:auto; }
  #mapEdit button { font:inherit; font-size:12.5px; color:var(--fg); padding:7px 12px; border-radius:8px;
    background:rgba(22,24,30,.86); border:1px solid rgba(255,255,255,.14); cursor:pointer;
    backdrop-filter:blur(6px); }
  #mapEdit button:hover { border-color:rgba(255,255,255,.3); }
  #mapEdit button.active { background:rgba(255,138,61,.3); border-color:var(--acc); }
  #mapEdit .sp { flex:1; }
  #editTypeBtn { display:flex; align-items:center; gap:8px; }
  #editTypeBtn .ico { width:22px; height:22px; display:grid; place-items:center; }
  #editTypeBtn .ico svg, #editTypeBtn .ico img { width:22px; height:22px; display:block; }
  #editModes { display:flex; gap:4px; }
  #editModes b { color:var(--acc); font-weight:600; margin-left:5px; }
  #finishLineBtn { border-color:var(--acc) !important; color:var(--acc) !important; }
  .counts { display:flex; gap:10px; font-size:11.5px; color:var(--dim);
    background:rgba(22,24,30,.8); padding:7px 11px; border-radius:8px; border:1px solid rgba(255,255,255,.1); }
  .counts b { color:var(--fg); font-variant-numeric:tabular-nums; }
  #hintline { position:absolute; top:60px; left:50%; transform:translateX(-50%); max-width:min(560px,86vw);
    font-size:12.5px; color:var(--dim); text-align:center; padding:7px 14px; border-radius:8px;
    background:rgba(22,24,30,.8); border:1px solid rgba(255,255,255,.1); }
  #joyBase { position:absolute; left:24px; bottom:24px; width:84px; height:84px; border-radius:50%;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.16); pointer-events:auto;
    touch-action:none; }
  #joyBase.on { border-color:var(--acc); }
  #joyKnob { position:absolute; left:50%; top:50%; width:38px; height:38px; margin:-19px 0 0 -19px;
    border-radius:50%; background:rgba(255,138,61,.55); border:1px solid var(--acc); }
  #mapDone { background:var(--acc) !important; color:#1a1200 !important; font-weight:600; }
  #mapFileStatus { position:absolute; left:24px; bottom:120px; font-size:12px; color:#7fbf8a;
    background:rgba(22,24,30,.8); padding:6px 10px; border-radius:7px; display:none; }
  #mapFileStatus.show { display:block; }

  .win-backdrop { position:fixed; inset:0; z-index:9; background:rgba(8,9,12,.6); display:none; }
  .win-backdrop.open { display:block; }
  .win { position:fixed; z-index:10; left:50%; top:50%; transform:translate(-50%,-50%) scale(.96);
    background:#181b22; border:1px solid rgba(255,255,255,.14); border-radius:14px; padding:16px;
    display:none; box-shadow:0 24px 70px rgba(0,0,0,.6); }
  .win.open { display:block; transform:translate(-50%,-50%) scale(1); }
  .win h3 { margin:0 0 12px; font-size:13px; font-weight:600; color:var(--dim);
    display:flex; justify-content:space-between; align-items:center; }
  .win h3 button { font:inherit; font-size:16px; line-height:1; padding:2px 9px; border-radius:7px;
    color:var(--fg); background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); cursor:pointer; }
  .tg { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
  .tg-card { width:104px; padding:8px 6px 9px; border-radius:10px; text-align:center; cursor:pointer;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12); }
  .tg-card:hover, .tg-card.active { border-color:var(--acc); background:rgba(255,138,61,.14); }
  .tg-fallback { width:60px; height:60px; margin:0 auto 6px; display:grid; place-items:center; }
  .tg-fallback svg, .tg-fallback img { width:52px; height:52px; display:block; }
  .tg-card span { font-size:11.5px; color:var(--fg); }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="cam">камера: <b id="camname">следом</b> — C переключить</div>

<div id="hud">
  <div id="gear">N</div>
  <div id="spd">0<small>км/ч</small></div>
</div>
<div id="keys">
  <b>W/↑</b> газ · <b>S/↓</b> тормоз/назад · <b>A/D</b> поворот<br>
  <b>Space</b> ручник · <b>C</b> камера · <b>R</b> сброс
</div>

<div id="pad">
  <div class="col">
    <button data-k="ArrowLeft">◀</button>
    <button data-k="ArrowRight">▶</button>
  </div>
  <div class="col">
    <button data-k="ArrowDown">▼</button>
    <button data-k="ArrowUp">▲</button>
  </div>
</div>

<div id="loader">
  <div class="box">
    <div class="t">Загрузка модели…</div>
    <div id="track"><div id="fill"></div></div>
    <div id="msg">auto/car.glb</div>
  </div>
</div>

<button id="mapBtn">Площадка</button>

<div id="mapEdit">
  <div class="bar">
    <button id="editTypeBtn"><span class="ico" id="typeIco"></span><span id="typeName">Конус</span></button>
    <div id="editModes">
      <button data-mode="place" class="active">Поставить<b>1</b></button>
      <button data-mode="move">Двигать<b>2</b></button>
      <button data-mode="delete">Удалить<b>3</b></button>
    </div>
    <button id="finishLineBtn" style="display:none">Завершить линию</button>
    <div class="sp"></div>
    <div class="counts">
      <span>конусов <b id="count">0</b></span>
      <span>линий <b id="countLines">0</b></span>
      <span>бордюр <b id="countCurb">0</b></span>
      <span>забор <b id="countFence">0</b></span>
      <span>эстакада <b id="countEstacada">0</b></span>
    </div>
    <button id="mapSaveBtn">Сохранить</button>
    <button id="mapLoadBtn">Загрузить</button>
    <button id="mapClearAll">Очистить</button>
    <button id="mapDone">Готово</button>
  </div>
  <div id="hintline">Режим редактирования площадки выключен</div>
  <div id="joyBase"><div id="joyKnob"></div></div>
  <div id="mapFileStatus"></div>
</div>
<input type="file" id="mapFileInput" accept="application/json,.json" hidden>

<div id="typeBackdrop" class="win-backdrop"></div>
<div id="typeWin" class="win">
  <h3>Объекты площадки<button id="typeClose">✕</button></h3>
  <div class="tg">
    <div class="tg-card" data-type="cones"><div class="tg-fallback"></div><span>Конус</span></div>
    <div class="tg-card" data-type="lines"><div class="tg-fallback"></div><span>Разметка</span></div>
    <div class="tg-card" data-type="curb"><div class="tg-fallback"></div><span>Бордюр</span></div>
    <div class="tg-card" data-type="fence"><div class="tg-fallback"></div><span>Забор</span></div>
    <div class="tg-card" data-type="estacada"><div class="tg-fallback"></div><span>Эстакада</span></div>
  </div>
</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
<script>
// Модель можно переключить адресом: index.html?model=auto/car.glb
// По умолчанию — auto/car.glb.
const MODEL = new URLSearchParams(location.search).get("model") || "auto/car.glb";
const ENV_URL = "https://assets.babylonjs.com/environments/environmentSpecular.env";

const canvas = document.getElementById("view");
const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer:true, stencil:true }, true);
const scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color4(0.07, 0.08, 0.10, 1);
scene.useRightHandedSystem = false;

const ip = scene.imageProcessingConfiguration;
ip.toneMappingEnabled = true;
ip.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
ip.exposure = 1.15;
ip.contrast = 1.08;

const cam = new BABYLON.ArcRotateCamera("cam", -Math.PI / 2, Math.PI / 2.6, 9, new BABYLON.Vector3(0, 0.7, 0), scene);
cam.attachControl(canvas, true);
cam.lowerRadiusLimit = 2.2;
cam.upperRadiusLimit = 40;
cam.lowerBetaLimit = 0.12;
cam.upperBetaLimit = Math.PI / 2 + 0.15;
cam.wheelDeltaPercentage = 0.02;
cam.pinchDeltaPercentage = 0.02;
cam.panningSensibility = 0;

const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
hemi.intensity = 0.45;
hemi.groundColor = new BABYLON.Color3(0.16, 0.17, 0.2);

const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.55, -1, 0.45), scene);
sun.position = new BABYLON.Vector3(7, 11, -6);
sun.intensity = 2.6;

const shadow = new BABYLON.ShadowGenerator(2048, sun);
shadow.useBlurExponentialShadowMap = true;
shadow.blurKernel = 32;
shadow.darkness = 0.42;

// мягкий свет внутри салона — включается только в режиме «салон» (см. applyCamMode)
const cabin = new BABYLON.PointLight("cabin", new BABYLON.Vector3(0, 0, 0), scene);
cabin.diffuse = new BABYLON.Color3(1, 0.96, 0.9);
cabin.range = 5;
cabin.intensity = 0;

// environment for PBR reflections (car paint is metallic)
try {
  scene.environmentTexture = BABYLON.CubeTexture.CreateFromPrefilteredData(ENV_URL, scene);
  scene.environmentIntensity = 0.85;
} catch (e) {}

// небо: градиентный купол, иначе горизонт не читается
const skyTex = new BABYLON.DynamicTexture("sky", { width:32, height:512 }, scene, true);
skyTex.hasAlpha = false;
{
  const g = skyTex.getContext();
  // в CreateSphere v=0 внизу сферы, поэтому зенит — низ канваса
  const grd = g.createLinearGradient(0, 0, 0, 512);
  grd.addColorStop(0.00, "#4e565f");   // под горизонтом
  grd.addColorStop(0.46, "#8fa3b3");
  grd.addColorStop(0.50, "#cfe4f7");   // горизонт
  grd.addColorStop(0.56, "#7ba8e4");
  grd.addColorStop(1.00, "#2f6fca");   // зенит
  g.fillStyle = grd;
  g.fillRect(0, 0, 32, 512);
  skyTex.update();
}
const skyMat = new BABYLON.StandardMaterial("skyMat", scene);
skyMat.backFaceCulling = false;
skyMat.disableLighting = true;
skyMat.diffuseColor = new BABYLON.Color3(0, 0, 0);
skyMat.specularColor = new BABYLON.Color3(0, 0, 0);
skyMat.emissiveTexture = skyTex;
const sky = BABYLON.MeshBuilder.CreateSphere("sky", { diameter:4000, segments:24, sideOrientation:BABYLON.Mesh.BACKSIDE }, scene);
sky.material = skyMat;
sky.infiniteDistance = true;
sky.isPickable = false;

const GROUND_SIZE = 320;
const TILE = 8;

const ground = BABYLON.MeshBuilder.CreateGround("ground", { width:GROUND_SIZE, height:GROUND_SIZE, subdivisions:1 }, scene);
const gm = new BABYLON.StandardMaterial("gm", scene);
gm.specularColor = new BABYLON.Color3(0.04, 0.04, 0.05);
gm.diffuseColor = new BABYLON.Color3(0.85, 0.85, 0.88);
ground.material = gm;
ground.receiveShadows = true;

// асфальт + разметка: без сетки движение не читается
const gridTex = new BABYLON.DynamicTexture("grid", { width:512, height:512 }, scene, true);
gridTex.hasAlpha = false;
// DynamicTexture по умолчанию ставит CLAMP — с uScale=40 текстура зажимается в кашу,
// поэтому тайлинг включаем явно
gridTex.wrapU = gridTex.wrapV = BABYLON.Texture.WRAP_ADDRESSMODE;
gridTex.uScale = gridTex.vScale = GROUND_SIZE / TILE;
// плоскость смотрится под скользящим углом — без анизотропии мылится вдаль
gridTex.anisotropicFilteringLevel = engine.getCaps().maxAnisotropy;
{
  const g = gridTex.getContext();
  g.fillStyle = "#41454c";            // асфальт
  g.fillRect(0, 0, 512, 512);
  // крупные пятна — потёртости и заплаты
  for (let i = 0; i < 60; i++) {
    const l = 52 + Math.random() * 26;
    g.fillStyle = "rgba(" + (l | 0) + "," + ((l * 1.02) | 0) + "," + ((l * 1.07) | 0) + ",0.5)";
    g.beginPath();
    g.arc(Math.random() * 512, Math.random() * 512, 14 + Math.random() * 46, 0, Math.PI * 2);
    g.fill();
  }
  // зерно асфальта крупными блоками: 1px-шум полностью съедается мипмаппингом
  for (let i = 0; i < 3000; i++) {
    const l = 38 + Math.random() * 52;
    g.fillStyle = "rgba(" + (l | 0) + "," + ((l * 1.02) | 0) + "," + ((l * 1.07) | 0) + ",0.5)";
    g.fillRect(Math.random() * 512, Math.random() * 512, 2 + (Math.random() * 3 | 0), 2);
  }
  // тонкая сетка каждые 2 м, заметная линия каждые 8 м
  g.strokeStyle = "rgba(150,160,175,0.10)";
  g.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    g.beginPath(); g.moveTo(i * 128, 0); g.lineTo(i * 128, 512); g.stroke();
    g.beginPath(); g.moveTo(0, i * 128); g.lineTo(512, i * 128); g.stroke();
  }
  g.strokeStyle = "rgba(185,195,210,0.30)";
  g.lineWidth = 4;
  g.strokeRect(0, 0, 512, 512);
  gridTex.update();
}
gm.diffuseTexture = gridTex;

const fill = document.getElementById("fill");
const msg = document.getElementById("msg");
const loader = document.getElementById("loader");
const spdEl = document.getElementById("spd");
const gearEl = document.getElementById("gear");
const camNameEl = document.getElementById("camname");

let meshes = [];
let ready = false;

function human(n) {
  return n >= 1e6 ? (n / 1e6).toFixed(2) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n);
}

// ===================== вождение =====================
// Модель: вперёд −Z, вверх +Y, +X — левая сторона, ось колёс X.
const CAR = {
  root: null,
  wheels: [],
  v: 0,            // м/с, + = вперёд
  yaw: 0,          // рад, + = налево
  steer: 0,        // текущий угол поворота колёс, + = налево
  y: 0,            // высота опоры под кузовом, м (0 = ровная земля)
  vy: 0,           // вертикальная скорость, для падений и спусков
  lift: 0,         // высота подъёма кузова над землёй
  track: 1.42,     // ширина колеи, м (половина идёт в опорные точки)
  maxSpeed: 40,    // ≈144 км/ч
  maxReverse: 11,
  accel: 9.5,
  reverseAccel: 6,
  brake: 18,
  drag: 0.0055,
  roll: 0.35,
  grip: 11,
  wheelbase: 2.75,
  wheelR: 0.32,
  camYaw: 0, camPitch: 1.13, camDist: 7.4,
  camFov: 1.45,    // угол обзора салона, рад (~83° по вертикали)
  mode: 0,           // 0 следом · 1 салон · 2 свободная
  eye: null,         // точка обзора в локальной системе кузова (заполняется по модели)
  lookYaw: 0, lookPitch: 0,  // смещение взгляда в салоне мышью
  idle: performance.now(),
};

const CAM_MODES = ["следом", "салон", "свободная"];
const COCKPIT_PITCH = 0.16;   // базовый наклон взгляда вниз, рад

const keys = Object.create(null);

const CONTROL_KEYS = new Set(["KeyW","KeyA","KeyS","KeyD","ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space","KeyC","KeyR"]);
addEventListener("keydown", (e) => {
  if (CONTROL_KEYS.has(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.code === "KeyC" && !editingMap) toggleCam();
  if (e.code === "KeyR") resetCar();
});
addEventListener("keyup", (e) => { keys[e.code] = false; });
addEventListener("blur", () => { for (const k in keys) keys[k] = false; });

// тач-кнопки
for (const b of document.querySelectorAll("#pad button")) {
  const code = b.dataset.k;
  const on = (e) => { e.preventDefault(); keys[code] = true; b.classList.add("on"); };
  const off = (e) => { e.preventDefault(); keys[code] = false; b.classList.remove("on"); };
  b.addEventListener("pointerdown", on);
  b.addEventListener("pointerup", off);
  b.addEventListener("pointercancel", off);
  b.addEventListener("pointerleave", off);
}

// Режимы камеры: следом → салон → свободная. attachedToElement надёжнее detachControl:
// он гасит и inputs камеры.
// Модель внешняя: внутренних поверхностей у неё нет, и из салона виден только
// односторонний кузов — с выключенным отсечением задних граней он читается как интерьер.
let twoSidedSaved = null;
function setTwoSided(on) {
  if (on && !twoSidedSaved) {
    twoSidedSaved = new Map();
    for (const m of meshes) {
      for (const mt of (Array.isArray(m.material) ? m.material : [m.material])) {
        if (!mt || twoSidedSaved.has(mt)) continue;
        twoSidedSaved.set(mt, [mt.backFaceCulling, mt.twoSidedLighting]);
        mt.backFaceCulling = false;
        mt.twoSidedLighting = true;
      }
    }
  } else if (!on && twoSidedSaved) {
    for (const [mt, v] of twoSidedSaved) { mt.backFaceCulling = v[0]; mt.twoSidedLighting = v[1]; }
    twoSidedSaved = null;
  }
}

// На виде из салона стёкла только мешают: гасим сами панели (прозрачность 100%),
// рамы остаются — они часть кузова. Возвращаем при выходе из режима.
let glassOff = null;
function setGlassOff(on) {
  if (on && !glassOff) {
    glassOff = meshes.filter(m => /windscreen|window|glass/i.test(m.name));
    for (const m of glassOff) m.isVisible = false;
  } else if (!on && glassOff) {
    for (const m of glassOff) m.isVisible = true;
    glassOff = null;
  }
}

function applyCamMode() {
  const m = CAR.mode;
  camNameEl.textContent = CAM_MODES[m];
  // салон — отдельная камера, привязанная к кузову; орбитальная нужна в двух
  // остальных режимах и мышь получает только в свободном
  scene.activeCamera = m === 1 ? cockpit : cam;
  if (m === 2) { cam.attachControl(canvas, true); cam.inputs.attachedToElement = true; }
  else { cam.detachControl(true); cam.inputs.attachedToElement = false; }
  // салон освещён только изнутри: снаружи свет не нужен и портил бы вид
  cabin.intensity = m === 1 ? 0.85 : 0;
  setTwoSided(m === 1);
  setGlassOff(m === 1);
  CAR.idle = -1e9;
}

function toggleCam() {
  CAR.mode = (CAR.mode + 1) % CAM_MODES.length;
  applyCamMode();
}

function resetCar() {
  if (!CAR.root) return;
  CAR.v = 0; CAR.yaw = 0; CAR.steer = 0;
  CAR.lookYaw = 0; CAR.lookPitch = 0;
  CAR.y = 0; CAR.vy = 0;
  upSmooth.set(0, 1, 0);
  // ориентация живёт в кватернионе (наклон по опоре), Euler оставляем нулевым
  CAR.root.rotation.set(0, 0, 0);
  if (!CAR.root.rotationQuaternion) CAR.root.rotationQuaternion = new BABYLON.Quaternion();
  CAR.root.rotationQuaternion.copyFrom(BABYLON.Quaternion.Identity());
  CAR.root.position.set(0, CAR.lift, 0);
  for (const w of CAR.wheels) { w.angle = 0; w.spin.rotation.x = 0; w.steer.rotation.y = 0; }
}

// угол обзора салона: мышь — колесо, телефон — щипок
function setCamFov(f) {
  CAR.camFov = clamp(f, 0.7, 1.9);
  if (cockpit) cockpit.fov = CAR.camFov;
}

// ручной облёт камеры мышью (в режимах «следом» и «салон»)
let drag = false, lastX = 0, lastY = 0;
const ptrs = new Map();   // активные указатели — по ним ловим щипок
let pinch = 0;
canvas.addEventListener("pointerdown", (e) => {
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (CAR.mode === 2) return;
  // двумя пальцами обзор не крутим — это щипок
  drag = ptrs.size === 1;
  lastX = e.clientX; lastY = e.clientY; CAR.idle = performance.now();
});
addEventListener("pointermove", (e) => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (CAR.mode === 1 && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    // раздвинули пальцы — приблизили
    if (pinch > 0 && d > 0) setCamFov(CAR.camFov * (pinch / d));
    pinch = d;
    return;
  }
  if (!drag || editGrab) return;
  if (CAR.mode === 1) {
    // в салоне тянем обзор: вправо — смотрим вправо, вниз — вниз.
    // по горизонтали без ограничений, по вертикали держим рамки от залипания на полу
    CAR.lookYaw = wrapAngle(CAR.lookYaw - (e.clientX - lastX) * 0.005);
    CAR.lookPitch = clamp(CAR.lookPitch + (e.clientY - lastY) * 0.004, -0.45, 0.55);
  } else {
    CAR.camYaw -= (e.clientX - lastX) * 0.006;
    CAR.camPitch = clamp(CAR.camPitch + (e.clientY - lastY) * 0.005, 0.32, 1.45);
  }
  lastX = e.clientX; lastY = e.clientY;
  CAR.idle = performance.now();
});
const dropPointer = (e) => {
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = 0;
  if (drag) CAR.idle = performance.now();
  drag = false;
};
addEventListener("pointerup", dropPointer);
addEventListener("pointercancel", dropPointer);
addEventListener("blur", () => { ptrs.clear(); pinch = 0; drag = false; });
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  if (CAR.mode === 1) { setCamFov(CAR.camFov * (1 + Math.sign(e.deltaY) * 0.07)); return; }
  if (CAR.mode !== 0) return;
  CAR.camDist = clamp(CAR.camDist * (1 + Math.sign(e.deltaY) * 0.08), 3.2, 26);
}, { passive:false });

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

function wrapAngle(a) {
  while (a > Math.PI) a -= Math.PI * 2;
  while (a < -Math.PI) a += Math.PI * 2;
  return a;
}

const camTarget = new BABYLON.Vector3(0, 0, 0);
let cockpit = null;   // камера салона, едет вместе с кузовом

// ── опора под колёсами ───────────────────────────────────────────────
// Земля — плоскость y=0, поэтому без editor.js машина едет по ровному месту.
// editor.js подключает surfaceProbe: тот сообщает высоту и нормаль поверхности
// под точкой (эстакады), а obstacleProbe — где стоят бордюры и заборы.
// surfaceProbe(x, z, fromY) → {y, nx, ny, nz} | null
// obstacleProbe(x, z, y, dx, dz) → true, если машину туда не пускать
let surfaceProbe = null;
let obstacleProbe = null;
let editorTick = null;   // editor.js перехватывает кадр, пока включён режим правки
let objectTick = null;   // editor.js обновляет конусы и при обычной езде
let editGrab = false;    // editor.js держит конус: мышь не должна одновременно крутить камеру
let editingMap = false;  // editor.js: открыт режим правки площадки

const MAX_SLOPE = 0.62;   // круче — считаем стеной, ~36°
const STEP_UP = 0.5;      // более высокий уступ за кадр просто не берём
const GRAVITY = 9.8;
const WHEEL_OFF = [[1, -1], [1, 1], [-1, -1], [-1, 1]];   // [±колея, ±вперёд]
const upSmooth = new BABYLON.Vector3(0, 1, 0);
const upTarget = new BABYLON.Vector3(0, 1, 0);
const carUp = new BABYLON.Vector3(0, 1, 0);
const carRight = new BABYLON.Vector3(1, 0, 0);
const carBack = new BABYLON.Vector3(0, 0, 1);
const carQuat = new BABYLON.Quaternion();
const supY = { y: 0, nx: 0, ny: 1, nz: 0, steep: 0, hit: true };

// Высота и наклон под четырьмя колёсами. Рейкаст идёт из точки НАД опорой:
// луч из самой точки колеса на подъёме уходит вниз мимо эстакады и машина проваливается.
function sampleSupport(x, z, fromY) {
  // без редактора мир плоский: ровная земля на нуле, машина не проваливается
  if (!surfaceProbe) {
    supY.hit = true; supY.y = 0; supY.steep = 0;
    supY.nx = 0; supY.ny = 1; supY.nz = 0;
    return supY;
  }
  const c = Math.cos(CAR.yaw), s = Math.sin(CAR.yaw);
  const rx = c, rz = s, fx = s, fz = -c;   // правый и передний векторы в мире
  const L = CAR.wheelbase / 2, T = CAR.track / 2;
  const cap = fromY + STEP_UP;
  let sumY = 0, n = 0, top = -1e9, nx = 0, ny = 0, nz = 0, steep = 0;
  for (const o of WHEEL_OFF) {
    const h = surfaceProbe ? surfaceProbe(x + rx * o[0] * T + fx * o[1] * L,
                                          z + rz * o[0] * T + fz * o[1] * L, fromY) : null;
    if (!h) continue;
    if (h.y > top) top = h.y;
    if (h.y > cap) continue;          // уступ выше допустимого — мимо
    sumY += h.y; n++;
    nx += h.nx; ny += h.ny; nz += h.nz;
    const sl = Math.acos(clamp(h.ny, -1, 1));
    if (sl > steep) steep = sl;
  }
  if (!n) {                              // под колёсами пусто — падать
    supY.hit = false; supY.y = fromY; supY.steep = 0;
    supY.nx = 0; supY.ny = 1; supY.nz = 0;
    return supY;
  }
  supY.hit = true;
  supY.y = sumY / n;
  const len = Math.hypot(nx, ny, nz) || 1;
  supY.nx = nx / len; supY.ny = ny / len; supY.nz = nz / len;
  supY.steep = steep;
  return supY;
}

// Кузов садится на опору и доворачивается по её нормали. На ровной земле базис
// даёт ровно rotation.y = -yaw, поэтому ровный режим не меняется.
function applySupport(dt) {
  const p = CAR.root.position;
  upTarget.set(supY.nx, supY.ny, supY.nz);
  if (upTarget.y < 0.05) { upTarget.y = 0.05; upTarget.normalize(); }
  // интерполируем именно вектор, а не углы: углы дают gimbal lock на уклонах
  BABYLON.Vector3.LerpToRef(upSmooth, upTarget, 1 - Math.exp(-dt * 12), upSmooth);
  upSmooth.normalize();
  carUp.copyFrom(upSmooth);

  // направление кузова, снятое с плоскости опоры
  carBack.set(-Math.sin(CAR.yaw), 0, Math.cos(CAR.yaw));
  carBack.subtractInPlace(carUp.scale(BABYLON.Vector3.Dot(carBack, carUp)));
  if (carBack.lengthSquared() < 1e-6) carBack.set(0, 0, 1);
  carBack.normalize();
  BABYLON.Vector3.CrossToRef(carUp, carBack, carRight);
  carRight.normalize();
  BABYLON.Quaternion.RotationQuaternionFromAxisToRef(carRight, carUp, carBack, carQuat);
  p.y = CAR.y + CAR.lift;
  if (CAR.root.rotationQuaternion) CAR.root.rotationQuaternion.copyFrom(carQuat);
  else CAR.root.rotationQuaternion = carQuat.clone();
}

function drive(dt) {
  const gas = keys.KeyW || keys.ArrowUp ? 1 : 0;
  const back = keys.KeyS || keys.ArrowDown ? 1 : 0;
  const left = keys.KeyA || keys.ArrowLeft ? 1 : 0;
  const right = keys.KeyD || keys.ArrowRight ? 1 : 0;
  const hand = keys.Space ? 1 : 0;

  const throttle = gas - back;
  const steerIn = left - right;

  // руль: на высокой скорости вращение ограничено, иначе машину крутит как игрушку
  const sp = Math.min(Math.abs(CAR.v) / CAR.maxSpeed, 1);
  const maxSteer = 0.58 - 0.44 * sp;
  const want = steerIn * maxSteer;
  const rate = (want === 0 ? 6 : 3.4) * dt;
  CAR.steer += clamp(want - CAR.steer, -rate, rate);

  // продольная динамика
  let a = 0;
  if (throttle > 0) {
    a = CAR.accel * throttle * clamp(1 - CAR.v / CAR.maxSpeed, 0.12, 1);
  } else if (throttle < 0) {
    if (CAR.v > 0.4) a = -CAR.brake * back;            // тормоз
    else a = -CAR.reverseAccel * back * clamp(1 + CAR.v / CAR.maxReverse, 0.1, 1);
  }
  if (hand) a -= Math.sign(CAR.v) * CAR.brake * hand * (Math.abs(CAR.v) > 0.05 ? 1 : 0);
  a -= Math.sign(CAR.v) * CAR.roll;
  a -= CAR.drag * CAR.v * Math.abs(CAR.v);

  CAR.v = clamp(CAR.v + a * dt, -CAR.maxReverse, CAR.maxSpeed);
  if (Math.abs(CAR.v) < 0.05 && !throttle) CAR.v = 0;

  // траектория: модель велосипеда, ограниченная сцеплением (иначе на скорости
  // машину закручивает сильнее, чем шины держат — получается занос)
  let yawRate = (CAR.v / CAR.wheelbase) * Math.tan(CAR.steer);
  const cap = (hand ? CAR.grip * 0.5 : CAR.grip) / Math.max(Math.abs(CAR.v), 2);
  yawRate = clamp(yawRate, -cap, cap);
  CAR.yaw += yawRate * dt;

  // трансформ кузова
  const fwd = new BABYLON.Vector3(Math.sin(CAR.yaw), 0, -Math.cos(CAR.yaw));
  const p = CAR.root.position;

  // --- горизонтальный шаг с проверкой препятствий
  // Движение проверяем до применения: рельеф (эстакады) и бордюры с забором
  // должны останавливать машину, а не выталкивать её после проникновения.
  if (Math.abs(CAR.v) > 1e-4) {
    const dx = fwd.x * CAR.v * dt, dz = fwd.z * CAR.v * dt;
    const nx = p.x + dx, nz = p.z + dz;
    let blocked = false;
    if (sampleSupport(nx, nz, CAR.y).steep > MAX_SLOPE) {
      blocked = true;
      CAR.v *= 0.25;                   // упёрлись в откос: газуем в пол почти без толку
    } else if (obstacleProbe && obstacleProbe(nx, nz, CAR.y, dx, dz)) {
      blocked = true;
      CAR.v = 0;
    }
    if (!blocked) { p.x = nx; p.z = nz; }
  }

  // --- вертикаль: вверх прижимаемся к опоре, вниз падаем с ускорением,
  // иначе съезд с вершины эстакады выглядит как прилипание к склону
  const sup = sampleSupport(p.x, p.z, CAR.y);
  if (sup.hit) {
    if (sup.y >= CAR.y - 0.01) { CAR.y = sup.y; CAR.vy = 0; }
    else {
      CAR.vy -= GRAVITY * dt;
      CAR.y = Math.max(sup.y, CAR.y + CAR.vy * dt);
      if (CAR.y <= sup.y) { CAR.y = sup.y; CAR.vy = 0; }
    }
  } else {
    CAR.vy -= GRAVITY * dt;
    CAR.y += CAR.vy * dt;
  }
  applySupport(dt);

  // колёса
  for (const w of CAR.wheels) {
    w.angle -= CAR.v / CAR.wheelR * dt;
    w.spin.rotation.x = w.angle;
    // руль поворота — в локальной системе модели, где +X это правая сторона,
    // поэтому поворот налево (CAR.steer > 0) это +rotation.y
    if (w.front) w.steer.rotation.y = CAR.steer;
  }

  // земля едет за машиной, сетка остаётся в мировых координатах
  ground.position.x = p.x;
  ground.position.z = p.z;
  gridTex.uOffset = p.x / TILE;
  gridTex.vOffset = p.z / TILE;

  // спидометр
  const kmh = Math.abs(CAR.v) * 3.6;
  spdEl.firstChild.nodeValue = String(Math.round(kmh));
  const a2 = Math.abs(CAR.v);
  gearEl.textContent = CAR.v < -0.3 ? "R" : a2 < 0.3 ? "N" : String(clamp(Math.floor(a2 / 9) + 1, 1, 5));

  // камера. target пишем напрямую: setTarget() пересчитывает alpha/beta/radius
  // по текущей позиции и каждый кадр уводил бы камеру в сторону.
  if (CAR.mode === 0) {
    BABYLON.Vector3.LerpToRef(camTarget, new BABYLON.Vector3(p.x, p.y + 0.75, p.z), 1 - Math.exp(-dt * 9), camTarget);
    cam.target.copyFrom(camTarget);
    // возврат камеры за спину по реальному времени, а не по числу кадров
    if (!drag && performance.now() - CAR.idle > 1600) CAR.camYaw *= Math.max(0, 1 - dt * 1.2);
    const k = 1 - Math.exp(-dt * 5);
    cam.alpha = wrapAngle(cam.alpha + wrapAngle((CAR.yaw + Math.PI / 2 + CAR.camYaw) - cam.alpha) * k);
    cam.beta += (CAR.camPitch - cam.beta) * (1 - Math.exp(-dt * 7));
    cam.radius += (CAR.camDist - cam.radius) * (1 - Math.exp(-dt * 7));
  } else if (CAR.mode === 1) {
    // салон: камера уже сидит в кузове, остаётся только повернуть взгляд
    if (!drag && performance.now() - CAR.idle > 1600) {
      const back = Math.max(0, 1 - dt * 1.6);
      CAR.lookYaw *= back; CAR.lookPitch *= back;
    }
    // локальные оси кузова: -Z вперёд, поэтому разворот на π, а лево — это -Yaw
    cockpit.rotation.set(COCKPIT_PITCH + CAR.lookPitch, Math.PI - CAR.lookYaw, 0);
  }
}

loader.classList.remove("hide");
fill.style.width = "0%";
fill.style.background = "";

// Геометрию модели берём по снимку сцены ДО загрузки: так в список не попадают
// ни земля, ни объекты редактора. Если бы мы обошли всю сцену, меши конусов
// утащили бы свои узлы под корень машины — и конусы ездили бы вместе с ней.
const preModelMeshes = new Set(scene.meshes);
BABYLON.SceneLoader.AppendAsync("", MODEL, scene,
  (ev) => {
    if (ev.lengthComputable) fill.style.width = ((ev.loaded / ev.total) * 100).toFixed(1) + "%";
    else fill.style.width = "100%";
    msg.textContent = human(ev.loaded / 1048576) + " / " + human(ev.total / 1048576) + " MB";
  }
).then(() => {
  meshes = scene.meshes.filter(m => !preModelMeshes.has(m) && !editorMeshes.has(m) && m.getTotalVertices() > 0);
  if (!meshes.length) throw new Error("в модели нет геометрии");

  let mn = new BABYLON.Vector3(1e9, 1e9, 1e9), mx = new BABYLON.Vector3(-1e9, -1e9, -1e9);
  const tmp = new BABYLON.Vector3();
  for (const m of meshes) {
    m.computeWorldMatrix(true);
    const wm = m.getWorldMatrix();
    const bb = m.getBoundingInfo().boundingBox;
    for (let i = 0; i < 8; i++) {
      BABYLON.Vector3.TransformCoordinatesToRef(bb.vectors[i], wm, tmp);
      mn = BABYLON.Vector3.Minimize(mn, tmp);
      mx = BABYLON.Vector3.Maximize(mx, tmp);
    }
    m.receiveShadows = true;
    shadow.addShadowCaster(m);
  }

  const center = BABYLON.Vector3.Center(mn, mx);
  const size = mx.subtract(mn);

  // --- корневой узел машины.
  // Лоадер строит сцену с зеркальным корнем __root__ (scale 1,1,-1) — это перевод
  // правостороннего glTF в левосторонний Babylon. Пересчитывать матрицы при переезде
  // нельзя: decompose зеркало теряет и колёса выворачивает диском внутрь. Поэтому
  // цепляем car к родному корню, не трогая его локальный трансформ.
  const root = new BABYLON.TransformNode("car", scene);
  CAR.root = root;
  const tops = new Set();
  for (const m of meshes) { if (editorMeshes.has(m)) continue; let c = m; while (c.parent) c = c.parent; tops.add(c); }
  for (const n of tops) n.parent = root;

  // --- колёса. У каждого колеса в сцене есть свой узел (TransformNode wheel_lf и т.п.)
  // с началом в центре колеса — он и есть ось вращения. Ставим под него руль и качение,
  // меши (лоадер режет их на примитивы) оставляем с их локальным трансформом.
  const groups = new Map();
  for (const m of meshes) {
    const n = m.parent;
    // /^wheel/ — а не /wheel/: иначе под колесо попадает узел steeringwheel
    if (!n || n === ground || !/^wheel/i.test(n.name)) continue;
    if (!groups.has(n)) groups.set(n, []);
    groups.get(n).push(m);
  }
  if (!groups.size) {
    const tmp2 = new BABYLON.Vector3();
    for (const m of meshes) {
      const bb = m.getBoundingInfo().boundingBox;
      const s = [bb.extendSize.x, bb.extendSize.y, bb.extendSize.z].sort((a, b) => a - b);
      if (!(s[0] < 0.14 && s[1] > 0.2 && Math.abs(s[1] - s[2]) < 0.1)) continue;
      BABYLON.Vector3.TransformCoordinatesToRef(bb.center, m.getWorldMatrix(), tmp2);
      if (Math.abs(tmp2.x) < 0.4 || Math.abs(tmp2.z) < 0.9) continue;
      if (!m._wn) { m._wn = new BABYLON.TransformNode("wheel_" + m.name, scene); m._wn.parent = root; }
      m._wn.position.copyFrom(tmp2);
      m.parent = m._wn;
      if (!groups.has(m._wn)) groups.set(m._wn, []);
      groups.get(m._wn).push(m);
    }
  }

  let minWheelY = 1e9, rSum = 0;
  const zs = [];
  for (const [node, g] of groups) {
    const wp = node.getAbsolutePosition();
    let r = 0;
    for (const m of g) {
      const bb = m.getBoundingInfo().boundingBox;
      r = Math.max(r, bb.extendSize.y, bb.extendSize.z);
    }
    // узел считается колесом, если его геометрия — диск: два равных размера и третий малый
    if (r < 0.2) { groups.delete(node); continue; }
    zs.push(wp.z);
    rSum += r;

    for (const m of g) {
      const bb = m.getBoundingInfo().boundingBox;
      for (let i = 0; i < 8; i++) {
        BABYLON.Vector3.TransformCoordinatesToRef(bb.vectors[i], m.getWorldMatrix(), tmp);
        minWheelY = Math.min(minWheelY, tmp.y);
      }
    }

    const steer = new BABYLON.TransformNode("steer_" + node.name, scene);
    steer.parent = node;
    const spin = new BABYLON.TransformNode("spin_" + node.name, scene);
    spin.parent = steer;
    for (const m of g) m.parent = spin;

    CAR.wheels.push({ steer, spin, node, front: wp.z < 0, angle: 0 });
  }

  const zMin = Math.min(...zs), zMax = Math.max(...zs);
  if (groups.size > 1 && zMax - zMin > 0.5) CAR.wheelbase = zMax - zMin;
  if (rSum > 0) CAR.wheelR = rSum / groups.size;
  for (const w of CAR.wheels) w.front = w.node.getAbsolutePosition().z < (zMin + zMax) / 2;

  // кузов поднимаем так, чтобы колёса встали на землю
  CAR.lift = minWheelY < 1e9 ? -minWheelY : -mn.y;
  root.position.set(0, CAR.lift, 0);

  // --- точка обзора для вида из салона. Ориентиры берём из самой модели:
  // руль задаёт поперечную координату водителя, верх крыши — высоту глаз.
  {
    const box = (list) => {
      const b = { x:[1e9,-1e9], y:[1e9,-1e9], z:[1e9,-1e9] };
      for (const m of list) {
        m.computeWorldMatrix(true);
        const wm = m.getWorldMatrix(), bb = m.getBoundingInfo().boundingBox;
        for (let i = 0; i < 8; i++) {
          BABYLON.Vector3.TransformCoordinatesToRef(bb.vectors[i], wm, tmp);
          b.x[0] = Math.min(b.x[0], tmp.x); b.x[1] = Math.max(b.x[1], tmp.x);
          b.y[0] = Math.min(b.y[0], tmp.y); b.y[1] = Math.max(b.y[1], tmp.y);
          b.z[0] = Math.min(b.z[0], tmp.z); b.z[1] = Math.max(b.z[1], tmp.z);
        }
      }
      return b;
    };
    const isWheel = (m) => CAR.wheels.some(w => w.spin.getChildren(n => true).includes(m));
    const body = box(meshes.filter(m => !isWheel(m)));
    const sw = box(meshes.filter(m => /steering/i.test(m.name)));
    const glass = box(meshes.filter(m => /windscreen|window/i.test(m.name)));
    const hasSw = isFinite(sw.x[0]);
    // по рулю: поперечная координата водителя и глубина, по остеклению — высота.
    // ориентир сверху — верх руля, а не крыша: глаза водителя много ниже крыши
    const ex = hasSw ? (sw.x[0] + sw.x[1]) / 2 : body.x[0] + (body.x[1] - body.x[0]) * 0.3;
    let ey = hasSw ? sw.y[1] + 0.19 : body.y[1] - 0.5;
    if (isFinite(glass.y[0])) ey = Math.min(ey, glass.y[1] - 0.1);
    const ez = hasSw ? (sw.z[0] + sw.z[1]) / 2 + 0.5 : body.z[0] + (body.z[1] - body.z[0]) * 0.55;
    // мировые координаты при старте = локальные + подъём, его и вычитаем
    CAR.eye = new BABYLON.Vector3(ex, ey - CAR.lift, ez);
    // свет салона едет вместе с машиной
    cabin.parent = root;
    cabin.position.copyFrom(CAR.eye);

    // камера салона: обычная UniversalCamera, привязанная к кузову, поэтому едет
    // с машиной сама, а поворот задаётся локально (rotation.y = PI — это вперёд)
    cockpit = new BABYLON.UniversalCamera("cockpit", BABYLON.Vector3.Zero(), scene);
    cockpit.parent = root;
    cockpit.position.copyFrom(CAR.eye);
    cockpit.rotation.set(COCKPIT_PITCH, Math.PI, 0);
    cockpit.fov = CAR.camFov;   // угол обзора настраивается колесом и щипком
    cockpit.minZ = 0.04;     // руль и панель приборов в упор
    cockpit.inputs.clear();  // обзором рулит общий обработчик мыши
  }

  cam.lowerRadiusLimit = 3.2;
  cam.upperRadiusLimit = 26;
  cam.alpha = CAR.yaw + Math.PI / 2;
  cam.beta = CAR.camPitch;
  cam.radius = CAR.camDist;
  camTarget.set(0, CAR.lift + 0.75, 0);
  cam.target.copyFrom(camTarget);
  applyCamMode();

  ready = true;
  scene.skipPointerMovePicking = true;
  fill.style.width = "100%";
  msg.textContent = "готово";
  setTimeout(() => loader.classList.add("hide"), 250);
}).catch((e) => {
  console.error(e);
  msg.innerHTML = '<span id="err">ошибка загрузки: ' + (e && e.message ? e.message : e) + "</span>";
  fill.style.background = "#ff6b6b";
});

window.addEventListener("resize", () => engine.resize());

let last = performance.now();
engine.runRenderLoop(() => {
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (ready) {
    if (objectTick) objectTick(dt);
    if (editorTick) editorTick(dt); else drive(dt);
  }
  scene.render();
});
</script>
<script src="editor.js"></script>
</body>
</html>
